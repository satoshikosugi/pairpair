appId: com.pairpair.app
productName: PairPair
electronVersion: 31.7.7
directories:
  app: .stage/app
  buildResources: build
  output: release-dist
files:
  - "out/**/*"
  - "node_modules/**/*"
  - "package.json"
asar: true
asarUnpack:
  - "node_modules/@pairpair/native-input/**/*"
npmRebuild: false
buildDependenciesFromSource: false
publish: null

win:
  target:
    - target: nsis
      arch:
        - x64

mac:
  target:
    - target: dmg
    - target: zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
